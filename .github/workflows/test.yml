name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eve
          POSTGRES_PASSWORD: eve
          POSTGRES_DB: eve_healthcare_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eve -d eve_healthcare_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://eve:eve@localhost:5432/eve_healthcare_test?schema=public
      JWT_SECRET: test-jwt-secret
      WEBHOOK_SECRET: test-webhook-secret
      NODE_ENV: test
      BCRYPT_ROUNDS: "4"
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm test
